<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apex · the daily climb</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#eef3f6;--fg:#13202c;--mut:#5a6b7a;--card:#fff;--line:#cfdae2;--acc:#0b86a8;--snow:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1720;--fg:#e6eef3;--mut:#8aa0b0;--card:#15232f;--line:#25384a;--acc:#4cc3e3;--snow:#dfeaf0}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:16px}
h1,h2,.big{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:700;margin:0;letter-spacing:.01em}
h1{font-size:44px;line-height:1}
.sub{margin:2px 0 0;color:var(--mut)}
#mtn{display:block;width:100%;max-height:240px;margin:12px 0 8px}
#stat{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:22px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}
h2{font-size:30px;line-height:1.1;margin:6px 0 12px}
.mut{color:var(--mut);margin:0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;width:100%;background:var(--acc);transition:width .3s ease}
input{width:100%;font:inherit;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{font:inherit;font-weight:600;margin-top:10px;padding:12px 16px;border-radius:8px;border:0;background:var(--acc);color:#04202a;cursor:pointer;width:100%;transition:all .2s}
button:hover{opacity:.9;transform:scale(1.01)}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px;align-items:center}
.row small{color:var(--mut);display:block}
.big{font-size:56px;line-height:1}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.pop{animation:pop .4s ease-out}
.bar i.hot{background:#ff5a4d;animation:pulse .2s ease-in-out infinite}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#snd{width:auto;margin:0;padding:6px 10px;font-size:14px;background:transparent;color:var(--fg);border:1px solid var(--line)}
#mtn{border-radius:12px;background:linear-gradient(#6fb3d9,#cfe8c8);overflow:hidden}
.ans{padding:2px 0 10px;max-height:400px;overflow-y:auto}
.ar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;font-size:14px;border-radius:6px;gap:8px}
.ar svg{flex-shrink:0;width:20px;height:20px}
.ar.me{background:var(--bg);font-weight:700;outline:1px solid var(--acc)}
.row.q{margin:0;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;color:var(--fg);font-weight:400;text-align:left;padding:8px 0;justify-content:space-between}
.row.q:hover{background:rgba(10,168,184,.05)}
@media (prefers-reduced-motion:reduce){@keyframes pop,pulse{animation:none!important}}
.pips{display:flex;gap:6px;margin-bottom:12px}.pips i{flex:1;height:8px;border-radius:4px;background:var(--line);transition:background .3s}.ico{margin-right:6px}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}.fx i{position:absolute;top:-30px;font-style:normal;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}@keyframes dr{from{transform:translateX(-60px)}to{transform:translateX(260px)}}@keyframes glow{0%,100%{opacity:.25}50%{opacity:.6}}
.cd{animation:dr 38s linear infinite}.cd2{animation:dr 55s linear infinite;animation-delay:-20s}.halo{animation:glow 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.fx i,.cd,.cd2,.halo{animation:none!important}}
.tl{text-align:right;font:600 15px "Barlow Condensed",sans-serif;color:var(--mut);margin-bottom:2px}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}.sh{animation:sh .3s;border-color:#ff5a4d}
.zb{font:700 22px "Barlow Condensed",sans-serif;color:var(--acc);margin:6px 0}
.gauge{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:4px 0 14px}.gauge i{display:block;height:100%;background:linear-gradient(90deg,#6fb3d9,#4cc3e3,#b07cff);border-radius:5px}
details{margin:10px 0;font-size:14px;color:var(--mut)}summary{cursor:pointer;font-weight:600}.lg{display:grid;gap:6px;margin-top:8px}.lg div{display:flex;align-items:center;gap:8px;color:var(--fg)}.lg svg{width:18px;height:18px;flex-shrink:0}
.card{box-shadow:0 2px 14px rgba(10,30,50,.07)}
@supports (-webkit-background-clip:text){h1{background:linear-gradient(90deg,var(--fg) 35%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}}
@keyframes snow{from{transform:translateY(-8px)}to{transform:translateY(246px)}}.sn{animation:snow 6s linear infinite}
@media (prefers-reduced-motion:reduce){.sn,.sh{animation:none!important}}
.hist{display:flex;align-items:flex-end;gap:4px;height:44px;margin:8px 0}.hist i{flex:1;background:linear-gradient(var(--acc),#6fb3d9);border-radius:3px 3px 0 0;opacity:.85}
.emo{font-size:24px;letter-spacing:6px;margin:6px 0}
.nm{flex:1}
body{background:radial-gradient(900px 420px at 50% -8%,rgba(111,179,217,.2),transparent 70%),var(--bg)}button{transition:transform .15s,box-shadow .15s}button:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(10,30,50,.15)}
.mb{display:block;height:4px;min-width:3px;border-radius:2px;margin-top:6px;opacity:.85}
</style></head><body>

if(mode==="daily"){const o=LS.g("ad");if(!o||o.d!==k||o.res[0].q!==res[0].q){LS.s("ad",{d:k,tot,res});const sp=LS.g("ap")||{n:0,b:0};LS.s("ap",{n:sp.n+1,b:Math.max(sp.b,tot)});LS.s("ah",(LS.g("ah")||[]).concat({d:k,t:tot}).slice(-30));lbSave(k,tot).then(board);const y=lk(new Date(Date.now()-864e5)),g=LS.g("as")||{n:0,l:""};LS.s("as",{n:g.l===k?g.n:g.l===y?g.n+1:1,l:k})}const g=LS.g("as");st=g?` · ${g.n}-day streak`:""}
$("app").innerHTML=`<div class="card pop"><p class="mut">Your climb${st}</p><p class="big">${m} m</p><h2>${z} · ${tot} pts</h2><div class="gauge" role="img" aria-label="${m} of 8,848 metres"><i style="width:${Math.min(100,tot/7)}%"></i></div><div id="lb"></div>${res.map((r,n)=>{const p=Q[n].p,top=Object.keys(p.a).find(x=>p.a[x]===100);
return`<button class="row q pop" style="animation-delay:${n*80}ms;animation-fill-mode:both" data-n="${n}" aria-expanded="false"><div><div>${em(p)} ${p.q}</div><small>You: ${r.a?esc(r.a):"skip"} · Best: ${bt(n)}</small><i class="mb" style="width:${r.s}%;background:${TC[tier(r.s)]}"></i></div><b style="color:${TC[tier(r.s)]}">+${r.s}</b></button><div class="ans" id="an${n}" hidden></div>`}).join("")}
<button id="cp">Copy</button><button id="ag" class="alt">${mode==="daily"?"Home":"Again"}</button></div>`;
document.querySelectorAll(".q").forEach(b=>b.onclick=()=>{const n=+b.dataset.n,d=$("an"+n);if(!d.innerHTML)d.innerHTML=list(n,res[n].a);d.hidden=!d.hidden;b.setAttribute("aria-expanded",String(!d.hidden))});
if(tot>=591)burst();setTimeout(board,400);$("ag").onclick=()=>{if(mode==="daily"){tot=0;res=[];pos();home()}else{Q=pick(Math.random()+"");start()}};
$("cp").onclick=async()=>{const share=`Apex #${dayNo(k)}\n${m} m · ${z}${st}\n${res.map(r=>["⬛","🟫","🟨","🟧","🟥","🟪"][[95,75,50,25,1,0].findIndex(t=>r.s>=t)]).join("")}`;if(navigator.share){try{await navigator.share({text:share});return}catch(e){}}try{await navigator.clipboard.writeText(share);$("cp").textContent="Copied ✓"}catch(e){$("cp").textContent="Copy failed"}setTimeout(()=>{$("cp").textContent="Copy"},1800)}}
function snd(){$("snd").textContent=mute?"🔇":"🔊"}
$("snd").onclick=()=>{mute=!mute;LS.s("am",mute);snd();SFX.lock()};
const em=p=>{const s=p.q.toLowerCase();return/asteroid/.test(s)?"☄️":/star/.test(s)?"⭐":/state|us city/.test(s)?"🗽":/volcano/.test(s)?"🌋":/island/.test(s)?"🏝️":/moon/.test(s)?"🌙":/tree/.test(s)?"🌲":/desert/.test(s)?"🏜️":/lake|river|ocean|trench|waterfall|\bsea\b/.test(s)?"🌊":/bird|egg|wing/.test(s)?"🦅":/element|metal|isotope|melting|electroneg|mineral|protein/.test(s)?"🧪":/animal|mammal|vertebrate|brain|legs|muscle|bone|dinosaur/.test(s)?"🐾":/country|capital|empire|language|time zone|speakers/.test(s)?"🌍":/building|dam|pyramid|film|book|company|athlete|play|food/.test(s)?"🏙️":"🏔️"};
const pips=n=>`<div class="pips" role="img" aria-label="Question ${n+1} of 7">${[0,1,2,3,4,5,6].map(k=>`<i style="${k<res.length?"background:"+TC[tier(res[k].s)]:k===n?"outline:2px solid var(--acc)":""}"></i>`).join("")}</div>`;
function cu(s){const e=$("sc");let v=0;const t=setInterval(()=>{v=Math.min(s,v+Math.max(1,Math.ceil(s/14)));e.textContent="+"+v;if(v>=s)clearInterval(t)},30)}
function burst(){const d=document.createElement("div");d.className="fx";d.setAttribute("aria-hidden","true");for(let k=0;k<28;k++){const e=document.createElement("i");e.textContent=["❄️","⭐","⛰️","🎉"][k%4];e.style.cssText=`left:${Math.random()*100}%;animation-delay:${Math.random()*.5}s;font-size:${14+Math.random()*14}px`;d.appendChild(e)}document.body.appendChild(d);setTimeout(()=>d.remove(),2600);try{navigator.vibrate&&navigator.vibrate([30,40,30])}catch(e){}}
let lz="Foothills";
const zb=()=>{const z=zone(tot),u=z!==lz;lz=z;return u?`<p class="zb">⛰️ ${z}!</p>`:""};
const bt=n=>{const a=Q[n].p.a,k=Object.keys(a).find(x=>a[x]===100)||"";return k.replace(/(^|\s)\w/g,c=>c.toUpperCase())};
const stats=()=>{const s=LS.g("ap");return s?`<p class="mut">🏔️ Best ${Math.round(s.b*12.64).toLocaleString()} m · ${s.n} climb${s.n>1?"s":""}</p>`:""};
const legend=()=>`<details><summary>How scoring works</summary><div class="lg"><div>Name the most extreme answer: 100 is the summit. Wrong guesses are free while time runs.</div>${T.slice(0,5).map((t,k)=>`<div><span style="color:${TC[t[1]]}">${TG[t[1]]}</span><b>${t[1]}</b> ${k?t[0]+"–"+(T[k-1][0]-1):t[0]+"–100"}</div>`).join("")}</div></details>`;
const hist=()=>{const h=(LS.g("ah")||[]).slice(-7);return h.length?`<div class="hist" role="img" aria-label="Your last climbs">${h.map(e=>`<i title="${e.d}: ${Math.round(e.t*12.64).toLocaleString()} m" style="height:${Math.max(8,e.t/7)}%"></i>`).join("")}</div>`:""};
$("ft").textContent=`${P.length} questions · ${P.reduce((s,p)=>s+Object.keys(p.a).length,0).toLocaleString()} answers in the bank`;
let LB=null,LU=null;
(async()=>{try{if(!window.claude||!claude.use)return;const d=await claude.use("db"),u=await claude.use("user");if(d&&u){LB=d;LU=u;board()}}catch(e){}})();
async function lbSave(k,tot){if(!LB||!LU)return;try{const id=await LU.id();if(!id)return;const r=LB.doc("scores/"+id),s=await r.get(),o=s.exists?(s.data()||{}):{},d=Object.assign({},o.d||{}),fresh=d[k]==null;d[k]=tot;const nd={};Object.keys(d).sort().slice(-14).forEach(x=>nd[x]=d[x]);await r.set({n:(o.n||0)+(fresh?1:0),b:Math.max(o.b||0,tot),d:nd})}catch(e){}}
async function board(){const el=document.getElementById("lb");if(!el||!LB||!LU)return;try{const s=await LB.collection("scores").get(),k=dayKey(),ks=[0,1,2,3,4,5,6].map(i=>lk(new Date(Date.now()-i*864e5))),all=s.docs.map(x=>Object.assign({id:x.id},x.data())),td=all.filter(r=>r.d&&r.d[k]!=null).sort((a,b)=>b.d[k]-a.d[k]).slice(0,8),wk=all.map(r=>({id:r.id,t:ks.reduce((a,x)=>a+((r.d&&r.d[x])||0),0),n:ks.filter(x=>r.d&&r.d[x]!=null).length})).filter(r=>r.n).sort((a,b)=>b.t-a.t).slice(0,8);if(!td.length&&!wk.length){el.textContent="";return}const ps=await LU.profiles([...new Set(td.concat(wk).map(r=>r.id))]),me=await LU.id(),nm=id=>{const p=ps[id];return((p&&p.name)||"Someone")+(id===me?" (you)":"")},blk=(h,rows,f)=>rows.length?`<details open><summary>${h}</summary><div class="lg">${rows.map((r,i)=>`<div><b>${i+1}.</b><span class="nm">${esc(nm(r.id))}</span><span>${f(r)}</span></div>`).join("")}</div></details>`:"";el.innerHTML=blk("Friends today",td,r=>Math.round(r.d[k]*12.64).toLocaleString()+" m")+blk("Friends this week",wk,r=>Math.round(r.t*12.64).toLocaleString()+" m · "+r.n+" day"+(r.n>1?"s":""))}catch(e){}}
snd();pos();home();
</script></body></html>
